<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background:#111; color:#eee; font-family:sans-serif;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; min-height:100vh; margin:0; }
  h3 { margin-bottom: 1em; }
  #status { margin-top: 1em; color:#aaa; }
  button { font-size:1.1em; padding:.7em 1.5em; border:none;
           border-radius:8px; cursor:pointer; background:#3a86ff;
           color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  video { border-radius:12px; max-width:90vw; }
</style>
</head>
<body>
<h3>📱 Phone Webcam</h3>
<video id="v" autoplay playsinline muted width="320"></video><br>
<canvas id="c" hidden></canvas>
<button id="btn" onclick="start()">Start Streaming</button>
<p id="status">idle</p>
<script>
let video = document.getElementById('v');
let canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let sending = false;

async function start() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'requesting camera...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    sending = true;
    status.textContent = 'streaming...';
    sendLoop();
  } catch(e) {
    status.textContent = 'error: ' + e.message;
    btn.disabled = false;
  }
}

async function sendLoop() {
  if (!sending) return;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async (blob) => {
    try {
      await fetch('/frame', { method: 'POST', body: blob });
    } catch(e) {
      console.error(e);
      sending = false;
      document.getElementById('status').textContent = 'disconnected';
      document.getElementById('btn').disabled = false;
      return;
    }
    setTimeout(sendLoop, 66);   // ~15 fps
  }, 'image/jpeg', 0.75);
}
</script>
</body>
</html>
